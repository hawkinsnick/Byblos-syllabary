name: Scoped academic closure controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/closure_controls.py --check
      - run: python scripts/test_closure_controls.py
      - run: python scripts/evidence_query.py --check
