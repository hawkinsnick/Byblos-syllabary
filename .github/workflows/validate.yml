name: Validate corpus and reproducible export
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_interoperability.py
      - run: python -m byblos release-check
      - run: python -m byblos validate
      - run: python -m unittest discover -s tests
      - run: python -m byblos export --output ci-snapshot
      - run: python -m byblos verify-export ci-snapshot
      - name: Check committed export is reproducible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from byblos.core import load_bundle
          from byblos.export import export_texts
          for name, content in export_texts(load_bundle()).items():
              assert Path("exports", name).read_text(encoding="utf-8") == content, name
          PY
      - run: python scripts/check_edition_locators.py --check
      - run: python scripts/audit_core_provenance.py --check
      - run: python scripts/audit_core_genealogy.py --check
