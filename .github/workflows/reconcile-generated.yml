name: Reconcile generated research artifacts (one-time)
on:
  push:
    branches:
      - byblos-parity-preexpert
      - eteocretan-rights-wall-audit-2026-10-06
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild reproducible collection review outputs
        run: python scripts/build_collection_handoff.py --write
      - name: Verify exact replay
        run: python scripts/build_collection_handoff.py
      - name: Commit only generated collection outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/collection-work-ledger.json review/collection-packet.json review/collection-decision-template.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate source-bound collection handoff artifacts"
            git push
          fi
